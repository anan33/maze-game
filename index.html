<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>لعبة المتاهة</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f4f1ea;--fg:#222;--btn:#4c97ff;--btn2:#3373cc;--btnfg:#fff;--card:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181c;--fg:#eee;--btn:#4c97ff;--btn2:#2b5fa8;--card:#24262c}}
:root[data-theme="dark"]{--bg:#17181c;--fg:#eee;--btn:#4c97ff;--btn2:#2b5fa8;--card:#24262c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,"Segoe UI",Tahoma,sans-serif;display:flex;flex-direction:column;align-items:center;gap:14px;padding:14px;min-height:100vh;touch-action:manipulation;user-select:none;-webkit-user-select:none}
h1{margin:0;font-size:1.3rem}
#wrap{position:relative;width:100%;max-width:640px}
canvas{width:100%;aspect-ratio:4/3;display:block;background:#fff;border-radius:10px;border:3px solid var(--btn2)}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(0,0,0,.55);border-radius:10px;color:#fff;font-size:1.4rem;text-align:center}
#ov.h{display:none}
.go{font:inherit;font-size:1.2rem;padding:10px 28px;border:0;border-radius:10px;background:var(--btn);color:#fff;cursor:pointer}
#pad{display:grid;grid-template-columns:repeat(3,76px);grid-template-rows:repeat(2,76px);gap:8px;direction:ltr;margin-bottom:8px}
#pad button{border:0;border-radius:16px;background:var(--btn);color:var(--btnfg);font-size:2rem;box-shadow:0 5px 0 var(--btn2);touch-action:none}
#pad button.on{transform:translateY(4px);box-shadow:0 1px 0 var(--btn2);background:var(--btn2)}
#u{grid-column:2;grid-row:1}#l{grid-column:1;grid-row:2}#d{grid-column:2;grid-row:2}#r{grid-column:3;grid-row:2}
footer{width:100%;max-width:420px;margin-top:4px;padding:10px 14px;border-top:2px solid var(--btn2);text-align:center;font-size:.8rem;line-height:1.8;color:var(--fg);opacity:.9}footer .sch{font-size:.95rem;font-weight:700;color:var(--btn2)}footer .moe{display:block;margin:0 auto 6px;height:54px;width:auto}footer b{font-weight:600}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) footer .sch{color:var(--btn)}}:root[data-theme="dark"] footer .sch{color:var(--btn)}
</style></head><body>

const ld=s=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=s});
const c=document.getElementById('c'),g=c.getContext('2d',{willReadFrequently:true});
const meow=new Audio(A.MEOW),laugh=new Audio(A.LAUGH);
const cat={x:-179,y:142,dir:90,size:20,cx:48,cy:50},donut={x:177,y:-118,dir:90,size:20,cx:72.117,cy:14.659};
let BG,CATI,DONI,bgData,keys={},running=false,done=false;
const bg=document.createElement('canvas');bg.width=480;bg.height=360;
function draw(ctx,img,s,res){ctx.save();ctx.translate(240+s.x,180-s.y);ctx.rotate((s.dir-90)*Math.PI/180);const k=s.size/100;ctx.scale(k,k);ctx.drawImage(img,-s.cx,-s.cy);ctx.restore()}

function touchDonut(){const a=mask(CATI,cat).slice();const b=mask(DONI,donut);for(let i=3;i<a.length;i+=4)if(a[i]>10&&b[i]>10)return true;return false}

function step(){

  cat.dir=D[k];const rad=cat.dir*Math.PI/180,dx=Math.sin(rad)*5,dy=Math.cos(rad)*5;
  cat.x=Math.max(-240,Math.min(240,cat.x+dx));cat.y=Math.max(-180,Math.min(180,cat.y+dy));
  if(touchBlack()){cat.x-=dx;cat.y-=dy;meow.currentTime=0;meow.play().catch(()=>{})}}

['u','d','l','r'].forEach(k=>{const b=document.getElementById(k);
